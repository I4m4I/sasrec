[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sasrec-review-implementation"
version = "0.1.0"
description = "SASRec background preparation, training, and candidate evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=1.5,<3", "torch>=2.7,<2.13"]

[project.scripts]
sasrec = "sasrec.cli:main"

[tool.setuptools.packages.find]
include = ["sasrec*"]
